id: id_1774767026344_3
description: >
  conversation-ui currently orchestrates the entire prompt→stream→extract
  pipeline, violating its own annotation ("presentation only"). Extract the
  coordination into a dedicated module so the flow can be tested and reused
  without the UI (e.g., headless batch mode, automated re-prompting).
status: accepted
timestamp: 2026-03-29T06:50:26.344Z
changes:
  - kind: add_block
    target_canvas: ai-codesign
    reason: >
      conversation-ui currently orchestrates the entire prompt→stream→extract
      pipeline, violating its own annotation ("presentation only"). Extract the
      coordination into a dedicated module so the flow can be tested and reused
      without the UI (e.g., headless batch mode, automated re-prompting).
    proposal:
      id: chat-orchestrator
      label: Chat Orchestrator
      type: module
      status: draft
      annotation: >
        Coordinates the prompt lifecycle: assembles context, dispatches to the
        active provider, collects the streamed response, triggers extraction,
        and pushes parsed ACPs to the pending queue. The UI calls this with a
        user message and a streaming callback; everything else is internal.
