id: id_1774767321817_19
description: >
  The LLM provider layer (provider.ts, cli-provider.ts, registry.ts) is the
  system's integration boundary with external AI tools. The CLI-first design
  (spawning claude/opencode/ollama as subprocesses via Tauri shell) is a key
  architectural decision that should be visible. It also depends on the Rust
  invoke_cli command — a backend dependency invisible in the current canvas.
status: accepted
timestamp: 2026-03-29T06:55:21.817Z
changes:
  - kind: add_block
    target_canvas: root
    reason: >
      The LLM provider layer (provider.ts, cli-provider.ts, registry.ts) is the
      system's integration boundary with external AI tools. The CLI-first design
      (spawning claude/opencode/ollama as subprocesses via Tauri shell) is a key
      architectural decision that should be visible. It also depends on the Rust
      invoke_cli command — a backend dependency invisible in the current canvas.
    proposal:
      id: llm-providers
      label: LLM Provider Layer
      type: external
      status: approved
      annotation: >
        Abstraction layer that detects and manages external CLI-based LLM tools.
        Spawns claude, opencode, or ollama as subprocesses — the app holds zero
        API keys and zero LLM SDK dependencies. Provider detection
        auto-discovers available tools at startup. Streaming output is relayed
        via Tauri events.
