    proposal:
      id: conversation-history
      label: Conversation History
      type: data-store
      status: draft
      annotation: >
        Maintains an ordered list of messages (user, assistant, system) plus
        metadata about which proposals were accepted/rejected. The context
        assembly layer reads this to build multi-turn prompts. Persisted to
