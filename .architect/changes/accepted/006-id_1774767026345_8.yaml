description: >
  The provider interface takes a single prompt, but effective co-design requires
  multi-turn context. Prior user requests, AI responses, and accepted/rejected
  proposals should inform the next prompt. Currently this context is lost
  between calls -- the AI re-discovers the design from scratch every time.
