[package]
name = "architect"
version = "0.1.0"
description = "Architect - Visual System Design Tool"
authors = ["Joey Zhou"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
walkdir = "2"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
